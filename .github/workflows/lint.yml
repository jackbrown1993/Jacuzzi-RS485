name: Lint

on:
  pull_request:
    branches: [ master ]

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for undefined names and unused imports
        uses: astral-sh/ruff-action@v3
        with:
          args: "check --select F401,F821 --ignore F403,F405 app"
