name: Build Docker image

on:
  pull_request:
    branches: [ main ]

jobs:
  build-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: build image (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
